<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Resume - Aryan Raj</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background-color: #f8f9fa;
        }

        .resume-container {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .resume-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 100%);
            color: white;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .resume-header h1 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .resume-header a {
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background-color: #00a8ff;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .resume-header a:hover {
            background-color: #0088cc;
            transform: translateY(-2px);
        }

        .resume-viewer {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem;
        }

        .pdf-frame {
            width: 100%;
            max-width: 900px;
            height: 800px;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
            background: white;
        }

        @media (max-width: 768px) {
            .resume-header {
                flex-direction: column;
                gap: 1rem;
            }

            .resume-header h1 {
                font-size: 1.2rem;
            }

            .resume-viewer {
                padding: 1rem;
            }

            .pdf-frame {
                max-width: 100%;
                height: 600px;
            }
        }

        .no-support {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 12px;
            max-width: 600px;
            margin: auto;
        }

        .no-support p {
            margin: 1rem 0;
            color: #666;
        }

        .no-support a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background-color: #ff6b6b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .no-support a:hover {
            background-color: #e15555;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="resume-container">
        <div class="resume-header">
            <h1>
                <i class="fas fa-file-pdf"></i>
                Resume - Aryan Raj
            </h1>
            <a href="index.html" title="Back to Portfolio">
                <i class="fas fa-arrow-left"></i> Back to Portfolio
            </a>
        </div>

        <div class="resume-viewer">
            <object 
                data="resume/Resume_Aryan_Raj (4).pdf" 
                type="application/pdf"
                class="pdf-frame"
                title="Resume PDF Viewer"
            >
                <div class="no-support">
                    <h2>Unable to Display PDF</h2>
                    <p>Your browser doesn't support inline PDF viewing.</p>
                    <p>You can download it instead:</p>
                    <a href="resume/Resume_Aryan_Raj (4).pdf" download>
                        <i class="fas fa-download"></i> Download Resume
                    </a>
                </div>
            </object>
        </div>
    </div>

    <script>
        // Fallback for browsers that don't support object tag
        const pdfObject = document.querySelector('.pdf-frame');
        
        // Check if PDF loaded (optional - most modern browsers support object tag for PDFs)
        if (!pdfObject.data) {
            pdfObject.outerHTML = `
                <div class="no-support">
                    <h2>Unable to Display PDF</h2>
                    <p>Your browser doesn't support inline PDF viewing.</p>
                    <p>You can download it instead:</p>
                    <a href="resume/Resume_Aryan_Raj (4).pdf" download>
                        <i class="fas fa-download"></i> Download Resume
                    </a>
                </div>
            `;
        }
    </script>
</body>
</html>
